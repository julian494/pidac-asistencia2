<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PIDAC</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:#0f1115; color:#e8e8e8; font-family:system-ui,sans-serif; text-align:center; }
    .box { padding:24px; max-width:420px; }
    .dot { width:14px; height:14px; border-radius:50%; background:#f5a623; margin:0 auto 16px;
           animation:p 1s infinite alternate; }
    @keyframes p { to { opacity:.25; } }
    a { color:#7aa2ff; }
    small { color:#888; display:block; margin-top:16px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="dot"></div>
    <h2>PIDAC</h2>
    <p id="estado">Buscando la cámara en tu red...</p>
    <small>Solo funciona si estás conectado al mismo WiFi que la cámara.</small>
  </div>

<script>
  // >>> CAMBIA ESTO si tu URL de Render es otra <<<
  const RELAY = "https://pidac-relay.onrender.com";

  const estado = document.getElementById("estado");
  async function buscar() {
    try {
      const r = await fetch(RELAY + "/api/discover");
      const d = await r.json();
      if (d.found) {
        estado.innerHTML = 'Cámara encontrada. Abriendo... <br><a href="' + d.url + '">Abrir manualmente</a>';
        location.href = d.url;
        return;
      }
      estado.textContent = "No hay cámara en esta red todavía. Reintentando...";
    } catch (e) {
      estado.textContent = "Conectando con el servidor (puede tardar si estaba dormido)...";
    }
    setTimeout(buscar, 5000);
  }
  buscar();
</script>
</body>
</html>
